<title>Зеленко – Протоколи</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1a0d;font-family:Georgia,serif;color:#e8f0e8;min-height:100vh}
@media print{body>*{display:none!important}#preview{display:block!important}.noprint{display:none!important}}
@media screen{#preview{display:none}}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.lcard{background:#111e11;border:1px solid #2a4a1a;border-radius:16px;padding:40px 30px;max-width:340px;width:100%;text-align:center}
.llogo{font-size:34px;font-weight:900;color:#f5e800}.llogo span{color:#7dc820;font-size:17px}
.lsub{font-size:12px;color:#5a7a3a;margin-bottom:28px}
.linp{background:#0a160a;border:2px solid #3a6a2a;border-radius:8px;color:#e8f0e8;padding:12px;font-size:22px;outline:none;width:100%;text-align:center;letter-spacing:6px;margin-bottom:10px}
.linp:focus{border-color:#7dc820}
.lbtn{width:100%;background:#4a7c20;color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:bold;cursor:pointer}
.lerr{color:#e05050;font-size:13px;min-height:18px;margin-top:6px}

/* SCREENS */
.screen{display:none;max-width:920px;margin:0 auto;padding:10px}
.card{background:#111e11;border:1px solid #2a4a1a;border-radius:12px;padding:14px;margin-bottom:10px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #2a4a1a}
.logo{font-size:20px;font-weight:900;color:#f5e800}.logo span{color:#7dc820;font-size:12px;margin-left:4px}
.htitle{font-size:15px;font-weight:bold;color:#f5e800}

/* NAV */
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.nbtn{flex:1;min-width:80px;background:#1a3a0a;border:1px solid #3a6a2a;color:#aad080;border-radius:8px;padding:8px 6px;font-size:12px;font-weight:bold;cursor:pointer;text-align:center}
.nbtn.active{background:#4a7c20;border-color:#7dc820;color:#fff}

/* FORM */
.sec{font-size:10px;color:#7dc820;text-transform:uppercase;letter-spacing:1px;font-weight:bold;margin-bottom:7px}
input[type=text],input[type=number],select,textarea{background:#0a160a;border:1px solid #3a6a2a;border-radius:6px;color:#e8f0e8;padding:7px 10px;font-size:14px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:#7dc820}
.clients{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cbtn{background:#1a3a0a;border:1px solid #3a6a2a;color:#aad080;border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer}
.cbtn.active{background:#4a7c20;border-color:#7dc820;color:#fff;font-weight:bold}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.f2{flex:2;min-width:120px}.fsm{flex:0 0 120px}
.group{margin-bottom:12px}
.glabel{font-size:11px;color:#aad080;margin-bottom:5px;padding-bottom:3px;border-bottom:1px solid #1a3a0a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:5px}
.item{display:flex;flex-direction:column;align-items:center;gap:3px;background:#0d180d;border:1px solid #1e3a1e;border-radius:9px;padding:7px 5px;text-align:center}
.item.active{background:#1a3a0a;border-color:#4a7c20}
.iname{font-size:12px;color:#c8e0a0;font-weight:bold;width:100%;word-break:break-word;line-height:1.2}
.item.active .iname{color:#fff}
.iprice{font-size:10px;color:#5a7a3a}
.isum{font-size:11px;color:#7dc820;font-weight:bold;min-height:14px}
.qty{width:72px;background:#0a140a;border:2px solid #2a4a2a;border-radius:7px;color:#668844;padding:5px 3px;font-size:17px;text-align:center;outline:none;font-weight:bold}
.item.active .qty{border-color:#7dc820;color:#f5e800;background:#0d2a0d}
.summary{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#0d2a0d;border-radius:8px;border:1px solid #2a5a2a;margin-bottom:10px}
.sinfo{font-size:12px;color:#aaa}.stotal{font-size:20px;font-weight:bold;color:#f5e800}
.genbtn{width:100%;background:#4a7c20;color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:bold;cursor:pointer;margin-bottom:6px}
.genbtn:disabled{opacity:.35;cursor:not-allowed}

/* HISTORY */
.hist-card{background:#0d2a1a;border:1px solid #2a5a3a;border-radius:10px;padding:11px;margin-bottom:9px}
.hist-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px}
.hist-client{font-size:15px;font-weight:bold;color:#f5e800}
.hist-meta{font-size:11px;color:#7dc820}
.hist-total{font-size:16px;font-weight:bold;color:#7dc820}
.hist-note{font-size:11px;color:#88aa66;font-style:italic;margin-bottom:4px}
.hist-items{font-size:11px;color:#aaa;line-height:1.7;margin-bottom:7px}
.hist-btns{display:flex;gap:7px;flex-wrap:wrap}
.hbtn{border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:bold;cursor:pointer}
.hbtn-v{background:#2a5a2a;color:#adf0ad}
.hbtn-s{background:#1a4a6a;color:#aaddff}
.hbtn-d{background:#5a1a1a;color:#f0adad}
.paid-badge{background:#1a5a1a;color:#adf0ad;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:bold;margin-left:6px}
.unpaid-badge{background:#5a3a0a;color:#ffcc66;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:bold;margin-left:6px}
.empty{text-align:center;color:#556644;padding:36px;font-size:14px}

/* STATS */
.stat-box{background:#0d2a1a;border:1px solid #2a5a3a;border-radius:10px;padding:14px;margin-bottom:10px}
.stat-title{font-size:12px;color:#7dc820;text-transform:uppercase;letter-spacing:1px;font-weight:bold;margin-bottom:10px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1a3a1a;font-size:13px}
.stat-row:last-child{border-bottom:none}
.stat-val{color:#f5e800;font-weight:bold}
.stat-bar{height:6px;background:#4a7c20;border-radius:3px;margin-top:3px}

/* STOCK */
.stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.stock-item{background:#0d2a1a;border:1px solid #2a5a3a;border-radius:9px;padding:10px}
.stock-name{font-size:12px;color:#aad080;font-weight:bold;margin-bottom:6px}
.stock-val{font-size:20px;font-weight:bold;color:#f5e800;text-align:center;margin-bottom:4px}
.stock-inp{text-align:center;font-size:16px;font-weight:bold}
.stock-low{border-color:#8a3a0a!important}
.stock-low .stock-val{color:#ff9944}

/* CLIENTS MANAGER */
.client-row{display:flex;align-items:center;gap:8px;padding:8px;background:#0d2a1a;border:1px solid #2a4a2a;border-radius:8px;margin-bottom:7px}
.client-info{flex:1;font-size:13px}
.client-name{font-weight:bold;color:#f5e800}
.client-addr{font-size:11px;color:#7dc820}
.delbtn{background:#5a1a1a;color:#f0adad;border:none;border-radius:5px;padding:5px 10px;font-size:11px;cursor:pointer;font-weight:bold}

/* PREVIEW */
#preview{max-width:820px;margin:0 auto;padding:20px;background:#fff;color:#000;font-family:Arial,sans-serif;font-size:12px}
#preview table{width:100%;border-collapse:collapse;margin-bottom:12px}
#preview td,#preview th{border:1px solid #000;padding:4px 6px}
#preview th{background:#D9E1F2;font-weight:bold}
#preview .tot{background:#D9E1F2;font-weight:bold}
#preview .rem{border:1px solid #000;min-height:55px;margin-bottom:12px;padding:4px 6px}
#preview .remlbl{font-weight:bold;border-bottom:1px solid #000;padding-bottom:3px;margin-bottom:4px}
#preview .final{text-align:right;font-weight:bold;font-size:16px;color:#1a5a1a;margin:14px 0 10px}
.btnrow{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.btnback{background:transparent;border:1px solid #3a7a1a;color:#3a7a1a;border-radius:7px;padding:8px 16px;font-size:13px;cursor:pointer}
.btnprint{background:#4a7c20;color:#fff;border:none;border-radius:7px;padding:8px 16px;font-size:13px;font-weight:bold;cursor:pointer}
.btnsave{background:#1a5a8a;color:#fff;border:none;border-radius:7px;padding:8px 16px;font-size:13px;font-weight:bold;cursor:pointer}
.btnshare{background:#6a1a8a;color:#fff;border:none;border-radius:7px;padding:8px 16px;font-size:13px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

  <div id="faceid-section">
    <div style="font-size:14px;color:#aad080;margin-bottom:16px">Влез с Face ID или парола</div>
    <button class="lbtn" id="faceid-btn" onclick="loginFaceID()" style="background:#1a3a5a;margin-bottom:10px;display:none">
      🔐 Влез с Face ID / Touch ID
    </button>
    <button class="lbtn" id="register-btn" onclick="registerFaceID()" style="background:#1a5a3a;margin-bottom:10px;display:none">
      ✅ Регистрирай Face ID
    </button>
  </div>
  <div style="font-size:11px;color:#3a5a3a;margin:8px 0">— или —</div>

  <button class="lbtn" onclick="checkPwd()" style="margin-top:8px">Влез с парола →</button>
  <div class="lerr" id="pwd-err"></div>
</div>
</div>

  <div class="hdr">
